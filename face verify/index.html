<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Attendance System</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .video-wrapper { width: 640px; height: 480px; background: #000; position: relative; border: 2px solid #333; }
        .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-left: 5px solid #0584ce; text-align: left; }
        .test-panel { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px dashed #555; }
        button { padding: 10px 20px; background: #00ff00; color: black; border: none; cursor: pointer; font-weight: bold; }
        canvas { display: none; }
    </style>
</head>
<body>
    <h1>Face Recognition Attendance</h1>

    <div class="main-container">
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline style="width:100%; height:100%;"></video>
            <div class="overlay">
                <div id="nameDisplay">User: ---</div>
                <div id="statusDisplay">Status: Idle</div>
                <div id="progressDisplay">Progress: 0/5</div>
            </div>
        </div>

        <div class="test-panel">
            <h3>No Webcam? Test with an Image File:</h3>
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="testWithImage()">Verify Image</button>
            <div id="imageResult" style="margin-top:10px; color: #00ff00;"></div>
        </div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const imageResult = document.getElementById('imageResult');

        // 1. Load UI even if Webcam fails
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                // Only start socket if webcam exists
                startWebSocket();
            } catch (err) {
                document.getElementById('statusDisplay').innerText = "Status: Webcam Mode Disabled (No Camera Found)";
            }
        }

        // 2. Manual Image Test Function
        async function testWithImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) return alert("Select a file first");

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            imageResult.innerText = "Processing...";
            const response = await fetch("http://localhost:8000/verify", {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            imageResult.innerText = `Result: ${data.name} | Status: ${data.status}`;
        }

        init();
    </script>
</body>
</html>
